---
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# If another push to the same PR or branch happens while this workflow is still running,
# cancel the earlier run in favor of the next run.
#
# There's no point in testing an outdated version of the code. GitHub only allows
# a limited number of job runners to be active at the same time, so it's better to cancel
# pointless jobs early so that more useful jobs can run sooner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.filter.outputs.python || 'true' }}
      deps: ${{ steps.filter.outputs.deps || 'true' }}
      sdk_py: ${{ steps.filter.outputs.sdk_py || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            python:
              - 'libs/langgraph/**'
              - 'libs/sdk-py/**'
              - 'libs/cli/**'
              - 'libs/checkpoint/**'
              - 'libs/checkpoint-sqlite/**'
              - 'libs/checkpoint-postgres/**'
              - 'libs/checkpoint-conformance/**'
              - 'libs/prebuilt/**'
            deps:
              - '**/pyproject.toml'
              - '**/uv.lock'
            sdk_py:
              - 'libs/sdk-py/**'
              - 'libs/langgraph/langgraph/pregel/remote.py'
              - 'libs/langgraph/langgraph/pregel/_remote_run_stream.py'

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    name: "cd libs/sdk-py / test #${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/uv_setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: test-libs/sdk-py
          working-directory: libs/sdk-py

      - name: Install dependencies
        shell: bash
        working-directory: libs/sdk-py
        run: uv sync --frozen --group test --no-dev

      - name: Run tests
        shell: bash
        working-directory: libs/sdk-py
        run: make test

      - name: Ensure the tests did not create any additional files
        shell: bash
        working-directory: libs/sdk-py
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  check-sdk-methods:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: "Check SDK methods matching"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run check_sdk_methods script
        run: python .github/scripts/check_sdk_methods.py

  ci_success:
    name: "CI Success"
    needs: [test, check-sdk-methods]
    if: |
      always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOBS_JSON: ${{ toJSON(needs) }}
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
      EXIT_CODE: ${{!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && '0' || '1'}}
    steps:
      - name: "CI Success"
        run: |
          echo $JOBS_JSON
          echo $RESULTS_JSON
          echo "Exiting with $EXIT_CODE"
          exit $EXIT_CODE
